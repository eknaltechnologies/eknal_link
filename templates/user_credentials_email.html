<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eknal Link Credentials</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f6fb;
      font-family: Arial, sans-serif;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 14px;
        padding: 35px 30px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      "
    >
      <!-- Logo -->
      <div style="text-align: center; margin-bottom: 20px">
        <img
          src="http://stack.eknaltechnologies.in/static/uploads/eknal_link.png"
          style="height: 55px"
          alt="Eknal Link Logo"
        />
      </div>
      <!-- Heading -->
      <h2
        style="
          text-align: center;
          color: #4f46e5;
          margin-bottom: 20px;
          font-size: 22px;
        "
      >
        Welcome to Eknal Link 🎉
      </h2>
      <!-- Greeting -->
      <p style="color: #444; font-size: 15px; margin-bottom: 15px">
        Hi {{ name }},
      </p>
      <!-- Message -->
      <p
        style="
          color: #555;
          font-size: 15px;
          line-height: 1.6;
          margin-bottom: 15px;
        "
      >
        Your account has been created successfully.
      </p>
      <!-- Credentials Box -->
      <div
        style="
          background: #f8f9ff;
          border: 1px solid #e0e7ff;
          border-radius: 10px;
          padding: 18px;
          margin-bottom: 20px;
        "
      >
        <p style="margin: 0 0 10px 0; color: #333; font-size: 15px">
          <strong>Username:</strong> {{ username }}
        </p>
        <p style="margin: 0; color: #333; font-size: 15px">
          <strong>Password:</strong> {{ password }}
        </p>
      </div>
      <!-- Info -->
      <p
        style="
          color: #777;
          font-size: 14px;
          margin-bottom: 25px;
          line-height: 1.6;
        "
      >
        Please log in and change your password after your first login for
        security purposes.
      </p>
      <!-- Button -->
      <div style="text-align: center">
        <a
          href="{{ login_url}}"
          style="
            display: inline-block;
            padding: 13px 26px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
          "
        >
          Login to Your Account
        </a>
      </div>
      <!-- Footer -->
      <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0" />
      <p style="text-align: center; font-size: 13px; color: #888">
        © Eknal Technologies
      </p>
    </div>
  </body>
</html>
